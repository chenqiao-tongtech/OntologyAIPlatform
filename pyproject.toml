[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p1-ontology-metamodel"
version = "1.0.0"
description = "P1 Ontology Engineering Platform meta-model baseline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "jsonschema[format]>=4.21,<5",
  "referencing>=0.35,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["ontology*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
